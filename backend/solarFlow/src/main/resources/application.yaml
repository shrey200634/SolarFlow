spring:
  application:
    name: solarflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:solarflow}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  jwt:
    secret: ${JWT_KEY}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}
  storage:
    local-dir: ${STORAGE_DIR:C:/solarflow-storage}