spring:
  application:
    name: solarflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:solarflow}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

app:
  seed:
    password: ${SEED_PASSWORD:}
  jwt:
    secret: ${JWT_KEY}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:15}
  storage:
    local-dir: ${STORAGE_DIR:C:/solarflow-storage}

solarflow:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      base-url: https://generativelanguage.googleapis.com
      timeout-seconds: 30

  bill:
    consumer-number-pattern: "^[0-9]{12}$"
    tariff-pattern: "(?i)^LT.*"
    field-confidence-threshold: 0.80
    low-quality-threshold: 0.5
    sanctioned-load-min-kw: 0.5
    sanctioned-load-max-kw: 50
    monthly-units-max: 5000
    implied-rate-min: 2
    implied-rate-max: 30