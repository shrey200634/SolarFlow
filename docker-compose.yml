services:
  db:
    image: postgres:16
    container_name: solarflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - solarflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend/solarFlow
    container_name: solarflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # inside Docker the database host is the service name, not localhost
      DB_HOST: db
      DB_PORT: "5432"
      STORAGE_DIR: /data/storage
    ports:
      - "8080:8080"
    volumes:
      - solarflow_storage:/data/storage

volumes:
  solarflow_pgdata:
  solarflow_storage: